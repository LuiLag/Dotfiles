# --- TEMA DE COLORES ---
include current-theme.conf

# --- FUENTE ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

# --- HYPRLAND Y WAYLAND ---
linux_display_server wayland
hide_window_decorations yes
window_padding_width 12
confirm_os_window_close 0

# --- TRANSPARENCIA Y CURSOR ---
background_opacity 0.85
cursor_shape beam
cursor_trail 1

# --- COMPORTAMIENTO ---
enable_audio_bell no
scrollback_lines 10000

# --- PESTAÑAS (TABS) ---
# Coloca la barra de pestañas en la parte inferior y dale estilo moderno.
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
# Muestra el título de la carpeta o programa activo en cada pestaña.
tab_title_template "{index}: {title}"

# --- ATAJOS PERSONALIZADOS ---
# Abrir una nueva pestaña en la misma carpeta donde estás ubicado (Ctrl + Shift + T).
map ctrl+shift+t new_tab_with_cwd

# Moverte rápido entre pestañas con Alt + Número.
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
