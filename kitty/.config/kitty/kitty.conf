# --- 1. FUENTE E ICONOS ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- 2. HYPRLAND, VENTANA Y TRANSPARENCIA ---
linux_display_server    wayland
background_opacity      0.88
window_padding_width    12
hide_window_decorations yes
confirm_os_window_close 0

# --- 3. CURSOR Y COMPORTAMIENTO ---
cursor_shape      beam
cursor_trail      3
enable_audio_bell no
scrollback_lines  10000

# --- 4. PESTAÑAS ESTÉTICAS (BARRA INFERIOR) ---
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"

active_tab_foreground   #11111B
active_tab_background   #CBA6F7
active_tab_font_style   bold
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
inactive_tab_font_style normal

# --- 5. ATAJOS DE PESTAÑAS ---
map ctrl+shift+t new_tab_with_cwd
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4

# --- 6. ESQUEMA DE COLORES (CATPPUCCIN MOCHA) ---
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

color0 #45475A
color8 #585B70
color1 #F38BA8
color9 #F38BA8
color2 #A6E3A1
color10 #A6E3A1
color3 #F9E2AF
color11 #F9E2AF
color4 #89B4FA
color12 #89B4FA
color5 #F5C2E7
color13 #F5C2E7
color6 #94E2D5
color14 #94E2D5
color7 #BAC2DE
color15 #A6ADC8
# --- 7. EXPLORADOR DE CARPETAS VISUAL (YAZI) ---
map ctrl+shfit+e launch --type=os-window --cwd=curre
