general {
    lock_cmd = pidof hyprlock || hyprlock       # Evita abrir dos pantallas de bloqueo a la vez
    before_sleep_cmd = loginctl lock-session    # Bloquea antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # Enciende monitores al despertar
}

# A los 5 minutos (300s): bloquea la sesión con tu Hyprlock dinámico
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# A los 10 minutos (600s): apaga los monitores para ahorrar energía
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
