# ============================================================================
# CONFIGURACIÓN DE HYPRLOCK (PANTALLA DE BLOQUEO MATERIAL 3 - DINÁMICA)
# ============================================================================

# Importa los colores dinámicos generados por Matugen ($primary, $secondary, $surface, $on_surface, $error)
source = /home/lu/.cache/matugen/colors-hyprlock.conf

# --- 1. CONFIGURACIÓN GENERAL ---
general {
    disable_loading_bar = true   # Oculta la barra de carga superior al bloquear
    hide_cursor = true           # Esconde el puntero del mouse para que se vea limpio
    grace = 0                    # Pide contraseña de inmediato (0 segundos de gracia)
    no_fade_in = false           # Activa transición suave al bloquear
}

# --- 2. FONDO DE PANTALLA DESENFOCADO EN VIVO ---
background {
    monitor =                    # Vacío = aplica en ambos monitores (DP-3 y HDMI-A-1)
    path = screenshot            # Toma el escritorio actual en vivo y lo desenfoca
    blur_passes = 3              # Intensidad del desenfoque tipo cristal
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.72            # Oscurece ligeramente para que resalte el reloj dinámico
    vibrancy = 0.1696
}

# --- 3. RELOJ GIGANTE (HORA ACTUAL - COLOR PRIMARIO MATUGEN) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = $primary
    font_size = 95
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# --- 4. FECHA DEBAJO DEL RELOJ ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = $on_surface
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# --- 5. SALUDO PERSONALIZADO (COLOR SECUNDARIO MATUGEN) ---
label {
    monitor =
    text = 󰄛  Hola, $USER
    color = $secondary
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -35
    halign = center
    valign = center
}

# --- 6. CAJA DE CONTRASEÑA (ESTILO CÁPSULA MATERIAL 3) ---
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary
    inner_color = $surface
    font_color = $on_surface
    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    hide_input = false
    rounding = 20
    check_color = $secondary
    fail_color = $error
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    position = 0, -100
    halign = center
    valign = center
}
