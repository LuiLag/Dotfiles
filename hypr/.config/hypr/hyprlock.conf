# ============================================================================
# CONFIGURACIÓN DE HYPRLOCK (PANTALLA DE BLOQUEO ESTÉTICA - CATPPUCCIN MOCHA)
# ============================================================================

# --- 1. CONFIGURACIÓN GENERAL ---
general {
    disable_loading_bar = true   # Oculta la barra de carga superior al bloquear
    hide_cursor = true           # Esconde el puntero del mouse para que se vea limpio
    grace = 0                    # Segundos de gracia antes de pedir contraseña (0 = pide clave inmediato)
    no_fade_in = false           # Activa transición suave al bloquear
}

# --- 2. FONDO DE PANTALLA DESENFOCADO ---
background {
    monitor =                                         # Vacío = aplica en todos tus monitores (DP-3 y HDMI-A-1)
    path = /home/lu/Pictures/Wallpapers/fondo.jpg     # Usa tu mismo fondo de pantalla
    blur_passes = 3                                   # Intensidad del desenfoque tipo cristal
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75                                 # Oscurece un poco el fondo para que resalte el reloj
    vibrancy = 0.1696
}

# --- 3. RELOJ GIGANTE (HORA ACTUAL) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>" # Actualiza la hora cada segundo (formato 24h)
    color = rgba(203, 166, 247, 1.0)                       # Color morado pastel (Catppuccin Mauve)
    font_size = 95
    font_family = JetBrainsMono Nerd Font
    position = 0, 160                                      # Centrado horizontalmente, arriba del centro
    halign = center
    valign = center
}

# --- 4. FECHA DEBAJO DEL RELOJ ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')" # Ej: jueves, 26 de noviembre
    color = rgba(205, 214, 244, 0.9)                        # Blanco suave (Catppuccin Text)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# --- 5. SALUDO PERSONALIZADO ---
label {
    monitor =
    text =   Hola, $USER                                   # Icono de gato + tu nombre de usuario
    color = rgba(137, 180, 250, 0.9)                        # Azul pastel (Catppuccin Blue)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -35
    halign = center
    valign = center
}

# --- 6. CAJA DE CONTRASEÑA (ESTILO CÁPSULA REDONDEADA) ---
input-field {
    monitor =
    size = 280, 50                                          # Ancho y alto de la cápsula
    outline_thickness = 2
    dots_size = 0.25                                        # Tamaño de los puntitos al escribir tu clave
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(203, 166, 247, 0.8)                  # Borde morado pastel
    inner_color = rgba(30, 30, 46, 0.85)                    # Fondo oscuro Catppuccin Base
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086"><i>Contraseña...</i></span>
    hide_input = false
    rounding = 20                                           # Esquinas bien redondeadas (Material Design)
    check_color = rgba(166, 227, 161, 1.0)                  # Borde verde al verificar contraseña
    fail_color = rgba(243, 139, 168, 1.0)                   # Borde rojo si te equivocas de clave
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    position = 0, -100                                      # Debajo del saludo
    halign = center
    valign = center
}
