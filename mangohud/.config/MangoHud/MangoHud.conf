# ============================================================================
# CONFIGURACIÓN DE MANGOHUD (~/.config/MangoHud/MangoHud.conf)
# ============================================================================

# --- 1. POSICIÓN Y DISEÑO VISUAL ---
position=top-left
background_alpha=0.45
round_corners=10
font_size=20
toggle_hud=Shift_R+F12

# --- 2. MÉTRICAS DE RENDIMIENTO (FPS Y FRAMETIME) ---
fps
frametime
frame_timing=1

# --- 3. HARDWARE (GPU RX 6650 XT, CPU RYZEN Y RAM) ---
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
vram

cpu_stats
cpu_temp
cpu_mhz

ram
