[config]
reload_apps = true

# Plantilla para Waybar (barra superior)
[templates.waybar]
input_path = "~/.config/matugen/templates/colors-waybar.css"
output_path = "~/.cache/matugen/colors-waybar.css"

# Plantilla para Kitty (terminal)
[templates.kitty]
input_path = "~/.config/matugen/templates/colors-kitty.conf"
output_path = "~/.cache/matugen/colors-kitty.conf"

# Plantilla para Rofi (lanzador de apps)
[templates.rofi]
input_path = "~/.config/matugen/templates/colors-rofi.rasi"
output_path = "~/.cache/matugen/colors-rofi.rasi"

# Plantilla para Hyprland (color del borde de ventanas en formato Lua)
[templates.hyprland]
input_path = "~/.config/matugen/templates/colors-hyprland.lua"
output_path = "~/.cache/matugen/colors-hyprland.lua"

# Actualiza los colores dentro de conky.conf automáticamente
[templates.conky_live]
input_path = "~/.config/matugen/templates/colors-conky.conf"
output_path = "~/.cache/matugen/colors-conky.conf"
post_hook = "sed -i \"s/color1 = '.*'/color1 = '{{colors.primary.default.hex_stripped}}'/; s/color2 = '.*'/color2 = '{{colors.secondary.default.hex_stripped}}'/; s/color3 = '.*'/color3 = '{{colors.on_surface.default.hex_stripped}}'/\" ~/dotfiles/conky/.config/conky/conky.conf"
