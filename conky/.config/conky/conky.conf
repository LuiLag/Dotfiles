conky.config = {
    -- --- RENDERIZADO ESTABLE EN WAYLAND / HYPRLAND ---
    output_backend = 'x11',
    background = true,
    update_interval = 1.0,
    total_run_times = 0,

    -- --- VENTANA TRANSPARENTE FLOTANTE ---
    own_window = true,
    own_window_class = 'ConkyClock',
    own_window_type = 'normal',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',

    -- --- UBICACIÓN (A LA DERECHA, EQUILIBRANDO EL PANEL DE LA IZQUIERDA) ---
    alignment = 'middle_right',
    gap_x = 120,
    gap_y = 0,
    minimum_width = 360,
    minimum_height = 280,

    -- --- TIPOGRAFÍA ---
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:bold:size=14',
    xftalpha = 1.0,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    double_buffer = true,

    -- --- COLORES DINÁMICOS (ACTUALIZADOS POR MATUGEN) ---
    color1 = 'cba6f7',   -- Color primario (Hora)
    color2 = '89b4fa',   -- Color secundario (Acento)
    color3 = 'cdd6f4',   -- Color texto (Minutos, fecha y clima)
};

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:bold:size=86}${time %H}${font}
${voffset -22}${color3}${font JetBrainsMono Nerd Font:bold:size=86}${time %M}${font}
${voffset 6}${color2}${font JetBrainsMono Nerd Font:bold:size=16}━━━━━━━━━━━━━━━━━━━━━━${font}
${voffset 4}${color3}${font JetBrainsMono Nerd Font:bold:size=15}${time %A, %d de %B}${font}
${voffset 8}${color2}${font JetBrainsMono Nerd Font:bold:size=14}    Mérida: ${color3}${execi 60 cat /tmp/clima_merida.txt 2>/dev/null || echo "Cargando..."}
]];
