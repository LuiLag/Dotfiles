conky.config = {
    output_backend = 'x11',
    background = true,
    update_interval = 1.0,
    total_run_times = 0,

    -- --- TARJETA FLOTANTE ESTILO MATERIAL 3 ---
    own_window = true,
    own_window_class = 'ConkyClock',
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_colour = '181820',
    own_window_argb_visual = true,
    own_window_argb_value = 225,
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',

    -- --- UBICACIÓN Y TAMAÑO ---
    alignment = 'middle_right',
    gap_x = 90,
    gap_y = 0,
    minimum_width = 360,
    minimum_height = 290,
    border_inner_margin = 22,
    draw_borders = false,
    border_width = 1,
    default_outline_color = '3a3a4a',

    -- --- TIPOGRAFÍA ---
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:bold:size=12',
    xftalpha = 1.0,
    draw_shades = false,
    draw_outline = false,
    double_buffer = true,

    -- --- COLORES DINÁMICOS ---
    color1 = 'cba6f7',   -- Primario
    color2 = '9399b2',   -- Subtítulos / Etiquetas
    color3 = 'f4f4f8',   -- Texto principal
};

conky.text = [[
${color2}${font JetBrainsMono Nerd Font:bold:size=12}  Mérida, Yucatán${font}
${voffset 10}${alignc}${color3}${font JetBrainsMono Nerd Font:bold:size=42}${time %I:%M %p}${font}
${voffset 2}${alignc}${color2}${font JetBrainsMono Nerd Font:size=12}${time %A, %d de %B %Y}${font}
${voffset 14}${color2}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${voffset 8}${color2}${font JetBrainsMono Nerd Font:size=11}CDMX ${color1}UTC-6${goto 205}${color2}Tokio ${color1}UTC+9${font}
${voffset 2}${color3}${font JetBrainsMono Nerd Font:bold:size=15}${tztime America/Mexico_City %I:%M %p}${goto 205}${tztime Asia/Tokyo %I:%M %p}${font}
${voffset 12}${color2}${font JetBrainsMono Nerd Font:size=11}Madrid ${color1}UTC+1${goto 205}${color2}Los Ángeles ${color1}UTC-8${font}
${voffset 2}${color3}${font JetBrainsMono Nerd Font:bold:size=15}${tztime Europe/Madrid %I:%M %p}${goto 205}${tztime America/Los_Angeles %I:%M %p}${font}
]];
